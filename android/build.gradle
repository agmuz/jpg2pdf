
// Fix dla flutter_tesseract_ocr (jcenter usunięte w Gradle 9)
subprojects {
    afterEvaluate { project ->
        if (project.name == 'flutter_tesseract_ocr') {
            project.repositories {
                mavenCentral()
                google()
            }
        }
    }
}

